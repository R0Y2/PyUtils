[project]
name = "py_utils"
version = "0.1.1"
description = "Common Python Utils"
authors = [
    {name = "rz", email = "royzou.rz@gmail.com"},
]

dependencies = []
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
lint = [
    "ruff>=0.8.2",
]
test = [
    "pytest>=8.3.4",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
